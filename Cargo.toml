[package]
name = "gpui-tools"
version = "0.7.0"
edition = "2024"

[[bin]]
name = "gpui-transparency-probe"
path = "src/bin/transparency_probe.rs"

[dependencies]
gpui-kit = "0.7.3"
global-hotkey = "0.8"
gpui-tray = { version = "0.1.4", default-features = false, features = ["gpui-kit"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = "thin"
