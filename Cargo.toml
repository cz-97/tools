[package]
name = "tools"
version = "0.20.4"
edition = "2024"
default-run = "tools"
repository = "https://github.com/cz-97/tools"

[dependencies]
gpui-kit = "0.7.3"
futures = "0.3"
global-hotkey = "0.8"
gpui-tray = { version = "0.1.4", default-features = false, features = ["gpui-kit"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
# 常驻跑的就是这个 dev 构建。完整 DWARF 会把 exe 撑到 58MB，进程里那些代码页全算在
# 工作集上；只要行号级别的回溯就够了，不需要每个变量的信息。
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
