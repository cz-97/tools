[package]
name = "gpui-tools"
version = "0.19.1"
edition = "2024"
default-run = "gpui-tools"

[dependencies]
gpui-kit = "0.7.3"
global-hotkey = "0.8"
gpui-tray = { version = "0.1.4", default-features = false, features = ["gpui-kit"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# GitHub 接口回来的 JSON：只读字段，不需要 derive。
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
